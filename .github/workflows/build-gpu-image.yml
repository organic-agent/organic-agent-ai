# score GPU 이미지(#68 · #77) — `score/Dockerfile.gpu` 를 빌드해 ECR `wes-score` 에 두 태그로 민다:
#   gpu          이동 태그. GPU 워커 인스턴스가 부팅할 때 pull 한다(파이프라인 v2, AMI 에 코드 이미지를 굽지 않음)
#   gpu-<sha>    불변 태그. 추적·롤백용 (`docker pull …:gpu-abc1234`)
# main 에 score/** 가 바뀌면 자동, 수동 실행도 된다. Lambda 배포(deploy-lambda.yml, CPU 이미지)와는 별개다.
name: Build score GPU image

on:
  push:
    branches: [main]
    paths:
      - "score/**"
      - ".github/workflows/build-gpu-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: score (GPU) → ECR :gpu
    runs-on: ubuntu-latest
    if: vars.AWS_LAMBDA_DEPLOY_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Free disk space (CUDA torch 이미지는 6GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Login to ECR
        run: |
          REPO=$(aws ecr describe-repositories --region ap-northeast-2 --repository-names wes-score --query 'repositories[0].repositoryUri' --output text)
          echo "REPO=$REPO" >> "$GITHUB_ENV"
          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin "${REPO%%/*}"

      - name: Build · push (gpu + gpu-<sha>)
        run: |
          SHA_TAG="gpu-${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            -f score/Dockerfile.gpu -t "$REPO:gpu" -t "$REPO:$SHA_TAG" --push score
          echo "pushed $REPO:gpu and $REPO:$SHA_TAG"
